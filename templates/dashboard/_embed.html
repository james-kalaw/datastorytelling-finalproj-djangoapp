<figure class="embed">
  <div class="embed-bar">
    <span class="mono">POWER BI · {{ page.title|upper }} PAGE</span>
    <a href="{{ page.embed_url }}" target="_blank" rel="noopener" style="color:#C9D6E5">Open full screen ↗</a>
  </div>
  <div class="embed-frame">
    <iframe title="Power BI report: {{ page.title }} page" src="{{ page.embed_url }}" allowfullscreen loading="lazy"></iframe>
  </div>
</figure>
